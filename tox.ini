[tox]
envlist = py39, py310, py311, py312, py313, lint, type
# Versions not installed locally are skipped; CI runs all of them.
skip_missing_interpreters = true
isolated_build = true

[testenv]
description = run unit and integration tests
extras = dev
commands = pytest --cov --cov-report=term {posargs}

[testenv:lint]
description = ruff lint and format check
skip_install = true
deps = ruff>=0.5
commands =
    ruff check .
    ruff format --check .

[testenv:type]
description = static type check
extras = dev
commands = mypy
