name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras (compiles the Cython extension)
        run: pip install -e ".[dev]"
      - name: Type check
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: mypy
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration tests
        run: pytest tests/integration --cov --cov-report=term

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PyPI classifiers (twine check does not)
        run: |
          pip install trove-classifiers
          python -c "import sys, tomllib; from trove_classifiers import classifiers; bad = [c for c in tomllib.load(open('pyproject.toml', 'rb'))['project']['classifiers'] if c not in classifiers]; sys.exit(f'Invalid PyPI classifiers: {bad}' if bad else 0)"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the built wheel outside the source tree
        run: |
          pip install dist/*.whl
          cd /tmp && amh-tokenizer tokenize "ኢትዮጵያ ጥሩ ናት" && amh-tokenizer models
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
